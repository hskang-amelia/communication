# Fork-only verification job: runs the Adapter behaviour probes plus the upstream tests that back the
# ara::com (R20-11) traceability. Results are emitted as check-run annotations ("PROBE_RESULT ...", "TEST ...").
name: Adapter Probes

on:
  push:
    branches: ["verify/**"]
  workflow_dispatch:

jobs:
  probes:
    name: Adapter probes
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
        with:
          disk-cache: ""
          cache-mode: disabled

      - name: Run probes and backing tests
        id: run-tests
        continue-on-error: true
        run: |
          bazel test --config=ci --keep_going --test_output=all \
            //score/mw/com/test/adapter_probes/... \
            //score/mw/com/test/fields/field_initial_value/... \
            //score/mw/com/test/receive_handler_usage/... \
            //score/mw/com/test/partial_restart/provider_restart/... \
            //score/mw/com/impl:proxy_field_test \
            //score/mw/com/impl:skeleton_field_test \
            2>&1 | tee bazel_test_output.txt
          exit "${PIPESTATUS[0]}"

      - name: Report results as annotations
        if: always()
        run: |
          # GitHub keeps at most 10 annotations per type and step, so results are aggregated.
          enc() { sed -e 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          probes=$(grep -rhoE "PROBE_(RESULT|INFO) .*" bazel-testlogs/ bazel_test_output.txt 2>/dev/null | sort -u | enc)
          echo "::notice title=probes::${probes:-none}"
          tests=$(sed -e 's/\x1b\[[0-9;]*m//g' bazel_test_output.txt | grep -E "^//[^ ]+ +.*(PASSED|FAILED|NO STATUS|FLAKY|TIMEOUT|SKIPPED)" | sed -E 's/ +/ /g' | enc)
          echo "::notice title=tests::${tests:-none}"
          errs=$(sed -e 's/\x1b\[[0-9;]*m//g' bazel_test_output.txt | grep -E "^ERROR: " | head -15 | enc)
          [ -n "$errs" ] && echo "::warning title=bazel-errors::${errs}"
          sed -e 's/\x1b\[[0-9;]*m//g' bazel_test_output.txt | grep -E "^//[^ ]+ +.*(FAILED|NO STATUS|TIMEOUT|FLAKY)" | awk '{print $1}' | head -8 | while read -r t; do
            p="${t#//}"; p="${p/://}"
            log=$(ls -t bazel-testlogs/${p}/test.log bazel-testlogs/${p}/run_*/test.log bazel-testlogs/${p}/shard_*/test.log 2>/dev/null | head -1)
            [ -n "$log" ] && echo "::warning title=${t}::$(tail -c 3500 "$log" | enc)"
          done
          echo "bazel exit outcome: ${{ steps.run-tests.outcome }}"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-probes-testlogs
          path: |
            bazel_test_output.txt
            bazel-testlogs/score/mw/com/test/adapter_probes/**/test.log
          if-no-files-found: ignore
